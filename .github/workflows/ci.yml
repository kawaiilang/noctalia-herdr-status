name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  python:
    name: Python helper tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the package and check the command
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-venv python3-setuptools python3-wheel
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --no-index --no-deps --no-build-isolation .
          .venv/bin/noctalia-herdr-status --help

      - name: Test the installed helper
        run: |
          export HERDR_STATUS_HELPER="$PWD/.venv/bin/noctalia-herdr-status"
          .venv/bin/python -I -m unittest discover -s tests -v

  nix-checks:
    name: Nix (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0

      - name: Run Luau plugin tests, Python tests and lint
        run: nix flake check --no-update-lock-file --print-build-logs

      - name: Run the packaged helper
        run: nix run --no-update-lock-file .#helper -- --help
