name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install package and run unit tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-venv python3-setuptools python3-wheel
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --no-index --no-deps --no-build-isolation .
          export HERDR_STATUS_HELPER="$PWD/.venv/bin/noctalia-herdr-status"
          export PYTHONPATH="$PWD/src:$PWD/tests"
          .venv/bin/python -m unittest discover -s tests -v

  nix-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - name: Run flake checks
        run: >-
          nix build --no-link --no-update-lock-file
          .#checks.x86_64-linux.plugin
          .#checks.x86_64-linux.lint
