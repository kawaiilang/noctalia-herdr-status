[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noctalia-herdr-status"
version = "1.0.0"
description = "Read-only Herdr TUI session status helper and Noctalia plugin with terminal window focus jump."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[project.scripts]
noctalia-herdr-status = "noctalia_herdr_status.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "ANN", "UP", "B"]
ignore = ["E501"]
